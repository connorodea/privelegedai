<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <filter id="blur-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="blur-medium" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <linearGradient id="emerald-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2EE6A6" />
      <stop offset="100%" stop-color="#17B87F" />
    </linearGradient>
    <linearGradient id="emerald-grad-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2EE6A6" />
      <stop offset="100%" stop-color="#17B87F" />
    </linearGradient>
    <linearGradient id="indigo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4C4FFF" />
    </linearGradient>
    <linearGradient id="indigo-grad-2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4C4FFF" />
    </linearGradient>
  </defs>

  <!-- Background ambient glow -->
  <circle cx="460" cy="240" r="180" fill="#2EE6A6" opacity="0.06" filter="url(#blur-heavy)" />
  <circle cx="340" cy="160" r="120" fill="#6366F1" opacity="0.05" filter="url(#blur-heavy)" />

  <!-- Large emerald disc (blurred, deep background) -->
  <circle cx="440" cy="240" r="130" fill="url(#emerald-grad)" opacity="0.12" filter="url(#blur-medium)" />

  <!-- Large emerald ring -->
  <circle cx="440" cy="240" r="110" fill="none" stroke="#2EE6A6" stroke-width="18" opacity="0.20" />
  <circle cx="440" cy="240" r="110" fill="none" stroke="#2EE6A6" stroke-width="6" opacity="0.30" />

  <!-- Second emerald disc overlapping -->
  <circle cx="430" cy="250" r="85" fill="#2EE6A6" opacity="0.08" />
  <circle cx="430" cy="250" r="85" fill="none" stroke="#17B87F" stroke-width="2" opacity="0.15" />

  <!-- Indigo hexagon overlapping -->
  <polygon
    points="315,130 370,100 420,130 420,195 370,225 315,195"
    fill="url(#indigo-grad)"
    opacity="0.15"
    filter="url(#blur-soft)"
  />
  <polygon
    points="315,130 370,100 420,130 420,195 370,225 315,195"
    fill="none"
    stroke="#6366F1"
    stroke-width="2.5"
    opacity="0.25"
  />

  <!-- Small indigo ring left side -->
  <circle cx="200" cy="180" r="28" fill="none" stroke="#4C4FFF" stroke-width="3" opacity="0.18" />
  <circle cx="200" cy="180" r="16" fill="#6366F1" opacity="0.10" filter="url(#blur-soft)" />

  <!-- Gold accent ring top-left -->
  <circle cx="160" cy="120" r="14" fill="none" stroke="#D4A843" stroke-width="2" opacity="0.20" />

  <!-- Floating dots -->
  <circle cx="520" cy="100" r="4" fill="#2EE6A6" opacity="0.35" />
  <circle cx="560" cy="180" r="3" fill="#2EE6A6" opacity="0.25" />
  <circle cx="300" cy="320" r="5" fill="#6366F1" opacity="0.22" />
  <circle cx="480" cy="50" r="3" fill="#D4A843" opacity="0.28" />
  <circle cx="140" cy="290" r="4" fill="#4C4FFF" opacity="0.18" />
  <circle cx="500" cy="380" r="3" fill="#2EE6A6" opacity="0.20" />
  <circle cx="180" cy="360" r="5" fill="#D4A843" opacity="0.15" />

  <!-- Small emerald fragment -->
  <ellipse cx="520" cy="300" rx="12" ry="8" fill="#2EE6A6" opacity="0.08" transform="rotate(-20 520 300)" />
  <ellipse cx="520" cy="300" rx="12" ry="8" fill="none" stroke="#2EE6A6" stroke-width="1.5" opacity="0.20" transform="rotate(-20 520 300)" />

  <!-- Thin gold ring -->
  <circle cx="280" cy="280" r="22" fill="none" stroke="#B8922E" stroke-width="1.5" opacity="0.18" />
</svg>