<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <filter id="blur-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="blur-medium" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>

    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A843" />
      <stop offset="100%" stop-color="#B8922E" />
    </linearGradient>
    <linearGradient id="indigo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4C4FFF" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2EE6A6" />
      <stop offset="100%" stop-color="#17B87F" />
    </linearGradient>
  </defs>

  <!-- Ambient glow -->
  <circle cx="200" cy="200" r="150" fill="#6366F1" opacity="0.05" filter="url(#blur-medium)" />
  <circle cx="200" cy="200" r="110" fill="#D4A843" opacity="0.04" filter="url(#blur-medium)" />

  <!-- Indigo rounded square (behind) -->
  <rect x="110" y="90" width="180" height="180" rx="36" fill="url(#indigo-grad)" opacity="0.14" />
  <rect x="110" y="90" width="180" height="180" rx="36" fill="none" stroke="#4C4FFF" stroke-width="2" opacity="0.22" />

  <!-- Indigo rounded square rotated (offset echo) -->
  <rect x="110" y="90" width="180" height="180" rx="36" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.14" transform="rotate(12 200 180)" />

  <!-- Gold diamond/rhombus (in front, overlapping) -->
  <polygon
    points="200,60 300,180 200,300 100,180"
    fill="url(#gold-grad)"
    opacity="0.16"
  />
  <polygon
    points="200,60 300,180 200,300 100,180"
    fill="none"
    stroke="#D4A843"
    stroke-width="2"
    opacity="0.26"
  />

  <!-- Inner gold diamond echo -->
  <polygon
    points="200,95 265,180 200,265 135,180"
    fill="none"
    stroke="#B8922E"
    stroke-width="1.5"
    opacity="0.18"
  />

  <!-- Emerald intersecting disc -->
  <circle cx="250" cy="250" r="55" fill="url(#emerald-grad)" opacity="0.12" filter="url(#blur-soft)" />
  <circle cx="250" cy="250" r="40" fill="none" stroke="#2EE6A6" stroke-width="2" opacity="0.22" />

  <!-- Scattered geometric fragments -->
  <circle cx="70" cy="80" r="3" fill="#2EE6A6" opacity="0.30" />
  <circle cx="330" cy="70" r="2.5" fill="#D4A843" opacity="0.28" />
  <circle cx="350" cy="320" r="4" fill="#6366F1" opacity="0.20" />
  <circle cx="60" cy="300" r="3" fill="#D4A843" opacity="0.22" />
  <circle cx="90" cy="180" r="2" fill="#2EE6A6" opacity="0.24" />
  <circle cx="310" cy="180" r="2.5" fill="#6366F1" opacity="0.22" />

  <!-- Small triangle fragments -->
  <polygon points="320,120 330,135 312,138" fill="#2EE6A6" opacity="0.20" />
  <polygon points="80,230 88,242 72,246" fill="#6366F1" opacity="0.18" />

  <!-- Thin ring fragments -->
  <circle cx="130" cy="150" r="16" fill="none" stroke="#B8922E" stroke-width="1.5" opacity="0.18" />
  <circle cx="280" cy="300" r="12" fill="none" stroke="#2EE6A6" stroke-width="1.5" opacity="0.18" />

  <!-- Tiny gold square -->
  <rect x="330" y="240" width="8" height="8" rx="2" fill="#D4A843" opacity="0.22" />
</svg>