<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Privileged — brand preview</title>
<style>
  body{background:#101216;color:#E4E0D8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:48px}
  h1{font-size:18px;font-weight:600;color:#8B867E;letter-spacing:.04em;text-transform:uppercase}
  .row{display:flex;gap:48px;flex-wrap:wrap;align-items:center;background:#08090B;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:40px;margin:24px 0}
  .cell{display:flex;flex-direction:column;gap:12px;align-items:center}
  .cell span{font-size:11px;color:#5C5852;font-family:ui-monospace,monospace}
  .dark{background:#08090B}
  .light{background:#F4F2EC}
  .light .cell span{color:#9a958c}
  .wmark{height:64px;width:auto}
</style>
</head>
<body>
<h1>Marks — keyhole negative space</h1>
<div class="row dark">
  <div class="cell"><img class="wmark" src="mark-keyhole-accent.svg" /><span>accent</span></div>
  <div class="cell"><img class="wmark" src="mark-keyhole-ink.svg" /><span>ink (dark bg)</span></div>
  <div class="cell"><img class="wmark" src="mark-keyhole-black.svg" /><span>black</span></div>
  <div class="cell"><img style="height:64px" src="mark-keyhole-accent.svg" /><span>accent</span></div>
</div>
<h1>Marks — column negative space</h1>
<div class="row dark">
  <div class="cell"><img class="wmark" src="mark-column-accent.svg" /><span>accent</span></div>
  <div class="cell"><img class="wmark" src="mark-column-ink.svg" /><span>ink (dark bg)</span></div>
  <div class="cell"><img class="wmark" src="mark-column-black.svg" /><span>black</span></div>
  <div class="cell"><img style="height:64px" src="mark-column-accent.svg" /><span>accent</span></div>
</div>
<h1>Wordmark (Mont Heavy, paths)</h1>
<div class="row dark">
  <div class="cell"><img class="wmark" style="height:64px" src="wordmark.svg" /><span>ink via currentColor</span></div>
</div>
<h1>Wordmark on light</h1>
<div class="row light">
  <div class="cell"><img class="wmark" style="height:64px" src="wordmark.svg" /><span>ink via currentColor</span></div>
</div>
<h1>Lockups (mark + wordmark)</h1>
<div class="row dark">
  <div class="cell" style="flex-direction:row;gap:20px"><img style="height:44px" src="mark-keyhole-accent.svg" /><img style="height:44px;filter:brightness(0) invert(0.9)" src="wordmark.svg" /><span style="display:none">lockup</span></div>
</div>
<div class="row light">
  <div class="cell" style="flex-direction:row;gap:20px"><img style="height:44px" src="mark-keyhole-black.svg" /><img style="height:44px;filter:brightness(0)" src="wordmark.svg" /><span style="display:none">lockup</span></div>
</div>
</body>
</html>
